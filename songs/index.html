<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="libraryView" class="container">
        <header>
            <h1>🎵 My Music</h1>
            <button id="menuBtn" class="menu-btn">☰</button>
        </header>

        <div id="menuPanel" class="menu-panel" style="display:none">
            <div class="menu-items">
                <button id="cameraToggleBtn" class="upload-label">
                    🎥 Enable Camera
                </button>
                <button id="refreshBtn" class="upload-label">
                    🔄 Refresh from Google Sheets
                </button>
                <a id="editSheetLink" target="_blank" class="upload-label" style="text-decoration: none;">
                    ✏️ Edit linked Google Sheet
                </a>
                <a id="driveFolderLink" target="_blank" class="upload-label" style="text-decoration: none;">
                    📂 Open Google Drive Folder
                </a>
                <a href="hand.html?debug" class="upload-label" style="text-decoration: none;">
                    👋 Practice Gestures
                </a>
                <label for="excelUpload" class="upload-label">
                    📁 Load Local File (Excel/CSV)
                    <input type="file" id="excelUpload" accept=".xlsx,.xls,.csv" style="display:none">
                </label>
            </div>
            <div style="margin-top: 15px;">
                <span id="fileStatus"></span>
            </div>
        </div>

        <div class="controls">
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="Search songs or artists...">
                <div id="songCounter" class="song-counter">0 songs</div>
            </div>

            <div class="filter-section">
                <select id="sortBy">
                    <option value="song">⇅ Sort by Song</option>
                    <option value="artist" selected>⇅ Sort by Artist</option>
                    <option value="yearAsc">↓ Sort by Year Asc</option>
                    <option value="yearDesc">↑ Sort by Year Desc</option>
                </select>

                <select id="filterInterpret">
                    <option value="">👥 All Artists</option>
                </select>

                <div class="range-slider-container">
                    <label>📅 Year: <span id="yearRangeLabel">-</span></label>
                    <div class="range-slider-wrapper">
                        <input type="range" id="yearMin" min="1900" max="2100" value="1900" class="range-slider">
                        <input type="range" id="yearMax" min="1900" max="2100" value="2100" class="range-slider">
                    </div>
                </div>

                <select id="filterKey">
                    <option value="">🎼 All Keys</option>
                </select>

                <select id="filterInstrumental">
                    <option value="">🎤/🎹 All</option>
                    <option value="1">🎹Instrumental</option>
                    <option value="0">🎤With Vocals</option>
                </select>

                <div class="range-slider-container">
                    <label>🥁 BPM: <span id="bpmRangeLabel">-</span></label>
                    <div class="range-slider-wrapper">
                        <input type="range" id="bpmMin" min="40" max="240" value="40" class="range-slider">
                        <input type="range" id="bpmMax" min="40" max="240" value="240" class="range-slider">
                    </div>
                </div>

                <button id="clearFilters">Clear Filters</button>
            </div>
        </div>

        <div id="songList" class="song-grid">
            <p class="empty-state">Loading song data ...</p>
        </div>
    </div>

    <div id="songView" class="container" style="display:none">
        <header class="song-header-bar">
            <button id="backBtn" class="header-icon-btn" aria-label="Back">←</button>
            <div class="song-header-info">
                <h1 id="songTitle"></h1>
                <div id="songMeta" class="song-meta-tags"></div>
            </div>
            <button id="playModeBtn" class="header-icon-btn" aria-label="Toggle gesture control">✋</button>
        </header>

        <nav class="song-actions-bar">
            <button id="countInBtn"><span class="btn-icon">🥁</span><span class="btn-text"> Count In</span></button>
            <a id="originalLink" target="_blank" style="display:none"><span class="btn-icon">🎵</span><span class="btn-text"> Original</span></a>
            <a id="karaokeLink" target="_blank" style="display:none"><span class="btn-icon">🎤</span><span class="btn-text"> Karaoke</span></a>
            <a id="editLink" target="_blank"><span class="btn-icon">✏️</span><span class="btn-text"> Edit</span></a>
        </nav>

        <div class="camera-wrapper" style="display:none">
            <video id="cameraFeed" autoplay playsinline></video>
            <div id="gestureIndicator" class="gesture-indicator-overlay">
                <span id="gestureStatus">Active</span>
            </div>
        </div>

        <div class="chunk-tabs" id="chunkTabs"></div>

        <div class="chunk-viewer">
            <div id="lyricsContent"></div>
        </div>
    </div>

    <script src="js/playtones.js"></script>
    <script src="js/gestures.js"></script>
    <script src="js/app.js"></script>
    <script src="js/song.js"></script>
</body>
</html>
