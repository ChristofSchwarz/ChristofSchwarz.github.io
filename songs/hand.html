<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Recognition</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/hand.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="js/gestures.js"></script>
</head>
<body>
    <div class="container">
        <header class="hand-header-bar">
            <button id="backButton" class="header-icon-btn" aria-label="Back">←</button>
            <h1 id="pageTitle">Practice Gestures</h1>
            <button id="cameraToggle" class="header-icon-btn" aria-label="Toggle camera" title="Camera on">🎥</button>
        </header>

        <div class="top-row">
            <div class="video-container">
                <video id="videoElement" autoplay playsinline muted></video>
                <canvas id="canvasElement"></canvas>
            </div>

            <div class="detection-display">
                <div class="finger-count" id="fingerCount">-</div>
                <div class="status" id="statusText">Initializing camera...</div>
            </div>
        </div>

        <div class="selection-boxes" id="selectionBoxes">
            <!-- Boxes will be dynamically generated -->
        </div>

        <div class="chunk-viewer" id="chunkViewer">
            <div class="chunk-content" id="chunkContent">
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <script src="js/hand.js"></script>
</body>
</html>
