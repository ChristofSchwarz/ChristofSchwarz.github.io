<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Recognition</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/hand.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="js/gestures.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="pageTitle">👋 Hand Gesture Recognition</h1>
        </header>

        <div class="button-ribbon">
            <button id="backButton" class="ribbon-button">← Back</button>
            <button id="cameraToggle" class="ribbon-button">⏸️ Pause Camera</button>
        </div>

        <div class="top-row">
            <div class="video-container">
                <video id="videoElement" autoplay playsinline muted></video>
                <canvas id="canvasElement"></canvas>
            </div>

            <div class="detection-display">
                <div class="finger-count" id="fingerCount">-</div>
                <div class="status" id="statusText">Initializing camera...</div>
            </div>

            <div class="info-box">
                <p><strong>Instructions:</strong> Show your hand to the camera. Make the <strong>🤙 call-me</strong> sign to go to the next practice section, or show <strong>4 fingers</strong> to go to the previous one - these are the same two gestures used in the real song viewer.</p>
            </div>
        </div>

        <div class="selection-boxes" id="selectionBoxes">
            <!-- Boxes will be dynamically generated -->
        </div>

        <div class="chunk-viewer" id="chunkViewer">
            <div class="chunk-content" id="chunkContent">
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <script src="js/hand.js"></script>
</body>
</html>
